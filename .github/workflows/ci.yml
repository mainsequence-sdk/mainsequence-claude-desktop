name: Claude Desktop integration
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: node scripts/install-devtools.cjs
        env:
          # Until 0.3.14 is published, build the exact checked archive from upstream.
          DEVTOOLS_SOURCE_REF: codex/linux-session-errors
      - run: npm run release:check
